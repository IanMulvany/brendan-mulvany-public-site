<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Archive - Brendan Mulvany</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f8f6f3;
            --text: #2c2c2c;
            --text-muted: #6b6b6b;
            --accent: #b8860b;
            --border: #ddd;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* Header - Magazine Style */
        .header {
            background: white;
            text-align: center;
            padding: 20px;
            border-bottom: 3px double var(--border);
        }

        .header__title {
            font-size: 2rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-bottom: 8px;
        }

        .header__subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
        }

        .header__nav {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .header__nav a {
            color: var(--text);
            text-decoration: none;
            padding: 6px 16px;
            font-family: -apple-system, sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s;
        }

        .header__nav a:hover,
        .header__nav a.active {
            color: var(--accent);
        }

        /* Main */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Featured Section */
        .featured {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .featured__main {
            aspect-ratio: 4/3;
            overflow: hidden;
            position: relative;
        }

        .featured__main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .featured__main .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
            font-size: 0.85rem;
        }

        .featured__side {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .featured__side-item {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .featured__side-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Section Headers */
        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0 16px;
        }

        .section-header::before,
        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .section-header h2 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 400;
            color: var(--text-muted);
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .gallery__item {
            cursor: pointer;
            transition: transform 0.3s;
        }

        .gallery__item:hover {
            transform: translateY(-4px);
        }

        .gallery__item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            filter: grayscale(20%);
            transition: filter 0.3s;
        }

        .gallery__item:hover img {
            filter: grayscale(0%);
        }

        .gallery__info {
            padding: 8px 0;
        }

        .gallery__title {
            font-size: 0.8rem;
            margin-bottom: 2px;
        }

        .gallery__meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: -apple-system, sans-serif;
        }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 48px;
        }

        .load-more {
            text-align: center;
            padding: 32px;
        }

        .load-more button {
            padding: 12px 32px;
            background: white;
            border: 1px solid var(--text);
            font-family: -apple-system, sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more button:hover {
            background: var(--text);
            color: white;
        }

        @media (max-width: 768px) {
            .featured { grid-template-columns: 1fr; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .header__title { font-size: 1.4rem; letter-spacing: 0.15em; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header__title">Brendan Mulvany</h1>
        <p class="header__subtitle">Photographic Archive</p>
        <nav class="header__nav">
            <a href="/" class="active">Collection</a>
            <a href="/index_rolls.html">Film Rolls</a>
            <a href="/index_years.html">Timeline</a>
            <a href="/index_themes.html">Themes</a>
            <a href="/index_featured.html">Selected</a>
        </nav>
    </header>

    <main class="main">
        <div class="section-header">
            <h2>Recent Photographs</h2>
        </div>

        <div class="gallery" id="gallery-container">
            <p class="loading-text">Loading images...</p>
        </div>

        <div class="load-more" id="gallery-load-more" style="display:none;">
            <button id="load-more-button">View More</button>
        </div>
    </main>

    <script>window.__STATIC_DATA__ = null;</script>
    <script src="/static/js/main.js"></script>
</body>
</html>
