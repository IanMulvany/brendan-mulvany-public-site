<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Archive - Brendan Mulvany</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #fdf9f3;
            --text: #1a1a1a;
            --text-muted: #666;
            --accent: #c41e3a;
            --border: #d4c5b0;
        }

        body {
            font-family: 'Times New Roman', Georgia, serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        /* Newspaper Header */
        .masthead {
            text-align: center;
            padding: 24px 16px;
            border-bottom: 2px solid var(--text);
        }

        .masthead__date {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .masthead__title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 8px 0;
            font-family: 'Playfair Display', Georgia, serif;
        }

        .masthead__tagline {
            font-style: italic;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Navigation */
        .nav {
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
            text-align: center;
        }

        .nav a {
            color: var(--text);
            text-decoration: none;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-family: -apple-system, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: color 0.2s;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--accent);
        }

        /* Main - Newspaper Grid */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        /* Headline Section */
        .headline {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }

        .headline__main {
            border-right: 1px solid var(--border);
            padding-right: 24px;
        }

        .headline__main img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .headline__main h2 {
            font-size: 1.8rem;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .headline__main p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .headline__side {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .headline__side-item {
            display: flex;
            gap: 12px;
        }

        .headline__side-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .headline__side-item h3 {
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .headline__side-item p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-family: -apple-system, sans-serif;
        }

        /* Search Bar */
        .search-bar {
            margin-bottom: 24px;
            text-align: center;
        }

        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 10px 16px;
            border: 1px solid var(--border);
            background: white;
            font-size: 0.9rem;
            font-family: -apple-system, sans-serif;
            outline: none;
        }

        .search-bar input:focus {
            border-color: var(--text);
        }

        /* Column Headers */
        .column-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--text);
            margin-bottom: 16px;
            font-family: -apple-system, sans-serif;
        }

        /* Gallery - Newspaper Columns */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .gallery__item {
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .gallery__item:hover {
            opacity: 0.8;
        }

        .gallery__image {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            filter: grayscale(30%) contrast(1.1);
            margin-bottom: 8px;
        }

        .gallery__info {
            border-top: 1px solid var(--border);
            padding-top: 6px;
        }

        .gallery__title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .gallery__meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: -apple-system, sans-serif;
            margin-top: 2px;
        }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 64px;
            font-style: italic;
        }

        .load-more {
            text-align: center;
            padding: 32px;
        }

        .load-more button {
            padding: 10px 24px;
            background: white;
            border: 1px solid var(--text);
            font-family: -apple-system, sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more button:hover {
            background: var(--text);
            color: white;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            border-top: 2px solid var(--text);
            margin-top: 48px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: -apple-system, sans-serif;
        }

        @media (max-width: 768px) {
            .masthead__title { font-size: 2.2rem; }
            .headline { grid-template-columns: 1fr; }
            .headline__main { border-right: none; padding-right: 0; border-bottom: 1px solid var(--border); padding-bottom: 24px; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }
    </style>
</head>
<body>
    <header class="masthead">
        <p class="masthead__date">Est. 2024 - Film Photography Archive</p>
        <h1 class="masthead__title">The Mulvany Chronicle</h1>
        <p class="masthead__tagline">"Preserving moments, one frame at a time"</p>
    </header>

    <nav class="nav">
        <a href="/" class="active">Front Page</a>
        <a href="/index_rolls.html">Film Rolls</a>
        <a href="/index_years.html">Archives</a>
        <a href="/index_themes.html">Categories</a>
        <a href="/index_featured.html">Editor's Picks</a>
    </nav>

    <main class="main">
        <div class="search-bar">
            <input type="text" placeholder="Search the archives..." id="search-input">
        </div>

        <h3 class="column-header">Latest From the Archive</h3>

        <div class="gallery" id="gallery-container">
            <p class="loading-text">Loading the latest edition...</p>
        </div>

        <div class="load-more" id="gallery-load-more" style="display:none;">
            <button id="load-more-button">Continue Reading</button>
        </div>
    </main>

    <footer class="footer">
        Brendan Mulvany Photo Archive - All Rights Reserved
    </footer>

    <script>window.__STATIC_DATA__ = null;</script>
    <script src="/static/js/main.js"></script>
</body>
</html>
