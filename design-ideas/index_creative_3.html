<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Archive - Brendan Mulvany</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --text: #ffffff;
            --text-muted: #888;
            --accent: #ff6b35;
            --border: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Header - Dark Elegant */
        .header {
            background: var(--surface);
            padding: 16px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .header__inner {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header__brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header__logo {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .header__title {
            font-size: 1rem;
            font-weight: 500;
        }

        .header__nav {
            display: flex;
            gap: 4px;
        }

        .header__nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .header__nav a:hover {
            color: var(--text);
            background: var(--border);
        }

        .header__nav a.active {
            color: var(--accent);
        }

        /* Hero Stats */
        .hero {
            padding: 48px 32px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .hero__stats {
            display: flex;
            justify-content: center;
            gap: 64px;
        }

        .hero__stat {
            text-align: center;
        }

        .hero__stat-value {
            font-size: 2.5rem;
            font-weight: 200;
            color: var(--accent);
        }

        .hero__stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Main */
        .main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 32px;
        }

        /* Search */
        .search-bar {
            margin-bottom: 32px;
        }

        .search-bar input {
            width: 100%;
            max-width: 480px;
            padding: 14px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar input:focus {
            border-color: var(--accent);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .gallery__item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            background: var(--surface);
        }

        .gallery__item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.4s ease;
            opacity: 0.9;
        }

        .gallery__item:hover img {
            transform: scale(1.08);
            opacity: 1;
        }

        .gallery__overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: flex-end;
            padding: 16px;
        }

        .gallery__item:hover .gallery__overlay {
            opacity: 1;
        }

        .gallery__info {
            color: white;
        }

        .gallery__title {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .gallery__meta {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            margin-top: 2px;
        }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 64px;
        }

        .load-more {
            text-align: center;
            padding: 48px;
        }

        .load-more button {
            padding: 14px 32px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more button:hover {
            background: #ff8555;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .hero__stats { gap: 32px; }
            .hero__stat-value { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header__inner">
            <div class="header__brand">
                <div class="header__logo">BM</div>
                <h1 class="header__title">Photo Archive</h1>
            </div>
            <nav class="header__nav">
                <a href="/" class="active">Browse</a>
                <a href="/index_rolls.html">Rolls</a>
                <a href="/index_years.html">Years</a>
                <a href="/index_themes.html">Themes</a>
                <a href="/index_featured.html">Featured</a>
            </nav>
        </div>
    </header>

    <div class="hero">
        <div class="hero__stats">
            <div class="hero__stat">
                <div class="hero__stat-value" id="total-count">--</div>
                <div class="hero__stat-label">Photographs</div>
            </div>
            <div class="hero__stat">
                <div class="hero__stat-value" id="year-range">--</div>
                <div class="hero__stat-label">Year Span</div>
            </div>
            <div class="hero__stat">
                <div class="hero__stat-value" id="roll-count">--</div>
                <div class="hero__stat-label">Film Rolls</div>
            </div>
        </div>
    </div>

    <main class="main">
        <div class="search-bar">
            <input type="text" placeholder="Search the archive..." id="search-input">
        </div>

        <div class="gallery" id="gallery-container">
            <p class="loading-text">Loading images...</p>
        </div>

        <div class="load-more" id="gallery-load-more" style="display:none;">
            <button id="load-more-button">Load More</button>
        </div>
    </main>

    <script>window.__STATIC_DATA__ = null;</script>
    <script src="/static/js/main.js"></script>
</body>
</html>
