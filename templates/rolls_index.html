<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolls - Brendan Mulvany Photo Archive</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Navigation styling */
        .header__title a {
            color: #fff;
            text-decoration: none;
        }
        .header__title a:hover {
            opacity: 0.9;
        }
        .header__title a:visited {
            color: #fff;
        }
        .header__nav-link {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .header__nav-link:hover {
            background-color: rgba(255,255,255,0.1);
        }
        .header__nav-link--active {
            background-color: rgba(255,255,255,0.2);
            font-weight: 600;
        }

        /* Ultra-Compact Grid for Rolls */
        .rolls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            padding: 1rem 0;
        }

        .roll-card {
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .roll-card:hover {
            transform: scale(1.03);
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .roll-card__link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .roll-card__image-wrapper {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
        }

        .roll-card__image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .roll-card__count {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 0.6rem;
            padding: 1px 4px;
            border-radius: 2px;
        }

        .roll-card__info {
            padding: 4px 6px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            color: #fff;
        }

        .roll-card__title {
            font-size: 0.7rem;
            font-weight: 600;
            margin: 0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .roll-card__date {
            font-size: 0.6rem;
            opacity: 0.85;
            margin: 0;
        }

        .view-header {
            margin-bottom: 1rem;
        }

        .view-header__title {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .view-header__description {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header__container">
            <h1 class="header__title"><a href="/">Brendan Mulvany Photo Archive</a></h1>
            <nav class="header__nav">
                <a href="/" class="header__nav-link">Home</a>
                <a href="/rolls" class="header__nav-link header__nav-link--active">Rolls</a>
                <a href="/years" class="header__nav-link">Years</a>
                <a href="/search" class="header__nav-link">Search</a>
                <a href="/about" class="header__nav-link">About</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="view-header">
            <h2 class="view-header__title">Rolls</h2>
            <p class="view-header__description">Browse the archive by film roll.</p>
        </section>

        <section class="rolls-grid" id="rolls-grid">
            <p class="loading-text">Loading rolls...</p>
        </section>
    </main>

    <script>window.__STATIC_DATA__ = null;</script>
    <script src="/static/js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const rollsGrid = document.getElementById('rolls-grid');
            const data = window.__STATIC_DATA__;

            if (!data || !data.rolls) {
                rollsGrid.innerHTML = '<p class="error-text">No data available.</p>';
                return;
            }

            rollsGrid.innerHTML = '';

            data.rolls.forEach(roll => {
                const rollCard = document.createElement('div');
                rollCard.className = 'roll-card';

                const coverImage = roll.images[0];
                const coverUrl = coverImage.thumbnail_url || coverImage.image_url;

                rollCard.innerHTML = `
                    <a href="/roll/${roll.roll_number}/index.html" class="roll-card__link">
                        <div class="roll-card__image-wrapper">
                            <img src="${coverUrl}" alt="Roll ${roll.roll_number}" class="roll-card__image" loading="lazy">
                            <div class="roll-card__count">${roll.count}</div>
                            <div class="roll-card__info">
                                <h3 class="roll-card__title">#${roll.roll_number}</h3>
                                <p class="roll-card__date">${formatDate(coverImage.capture_date)}</p>
                            </div>
                        </div>
                    </a>
                `;
                rollsGrid.appendChild(rollCard);
            });
        });

        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short' });
            } catch (e) {
                return dateString;
            }
        }
    </script>
</body>

</html>
